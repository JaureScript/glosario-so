site_name: Glosario de Sistemas Operativos
theme:
  name: material
  language: es
  features:
    - navigation.tabs # Mueve el menú principal a pestañas superiores (más limpio)
    - navigation.tabs.sticky
    - navigation.sections # Agrupa mejor los submenús
    - toc.integrate # Oculta la barra derecha y la integra a la izquierda (minimalista)
    - search.suggest
    - search.highlight
  palette:
    # Modo claro por defecto
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Modo oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
nav:
  - Índice Alfabético: Índice Alfabético (A-Z).md
  - Módulos de Estudio:
      - Módulo 1: Índice Módulo 1.md
      - Módulo 2: Índice Módulo 2.md
      - Módulo 3: Índice Módulo 3.md
      - Módulo 4: Índice Módulo 4.md
      - Módulo 5: Índice Módulo 5.md
      - Módulo 6: Índice Módulo 6.md
  - Anexos: 
    - Anexo A: Anexo_A.md
    - Anexo B: Anexo_B.md
    - Anexo C: Anexo_C_Mapa.md
  - Referencias: Referencias.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format


extra_css:
  - stylesheets/extra.css